<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Destino FC</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--panel:#17171a;--p2:#111113;--p3:#212126;--fx:#2a2a30;--fxt:#f2f2f2;--line:#38383f;--chalk:#fafafa;--mute:#9b9ba3;--y:#ffffff;--g:#ffffff;--red:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f6f6f4;--panel:#ffffff;--p2:#ececea;--p3:#e2e2df;--fx:#e8e8e6;--fxt:#111111;--line:#cfcfcb;--chalk:#0a0a0b;--mute:#66666d;--y:#0a0a0b;--g:#0a0a0b}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--chalk);font:16px/1.4 'Work Sans',system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:center;font-family:'Archivo Black',Impact,sans-serif;font-size:22px;padding:4px 0 12px}
.top span{color:var(--y)}
h2{font-family:'Archivo Black',Impact,sans-serif;font-weight:400;font-size:24px;margin:6px 0 10px}
h3{font-family:'Archivo Black',Impact,sans-serif;font-weight:400;font-size:22px;margin:0 0 4px}
.pg{height:8px;border-radius:4px;background:var(--panel);margin-bottom:16px;overflow:hidden}.pg b{display:block;height:100%;background:var(--g)}
button,input{font:inherit;color:var(--chalk)}
.btn{border:2px solid var(--chalk);background:transparent;border-radius:30px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer}
.btn.p{background:var(--chalk);color:var(--bg)}.btn:disabled{opacity:.4}
.btn:focus-visible,input:focus-visible,.cl:focus-visible,.pos:focus-visible,.c:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.nav{position:sticky;bottom:0;display:flex;gap:12px;padding:12px 0;background:linear-gradient(transparent,var(--bg) 30%)}.nav .btn{flex:1}
.in{width:100%;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-weight:700;font-size:16px;text-transform:uppercase}
.lbl{font-size:12px;letter-spacing:.06em;color:var(--mute);text-align:center;margin:14px 0 6px;font-weight:700;text-transform:uppercase}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-radius:14px;padding:5px}.seg button{border:0;background:transparent;border-radius:10px;padding:8px;font-weight:700;color:var(--mute)}.seg .on{background:var(--chalk);color:var(--bg)}
.cs{background:var(--panel);border-radius:18px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:12px}
.c{display:flex;gap:10px;align-items:center;padding:9px 10px;background:transparent;border:0;border-radius:10px;font-weight:600;text-align:left;cursor:pointer}.c .f{font-size:22px}
.pitch{position:relative;aspect-ratio:.72;border-radius:18px;background:repeating-linear-gradient(#1c1c20 0 12.5%,#141417 12.5% 25%);border:3px solid #3a3a41;margin:6px 0}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.pos{position:absolute;transform:translate(-50%,-50%);background:#0a0a0b;border:2px solid #4a4a52;color:#fff;border-radius:30px;padding:6px 11px;font-size:14px;font-weight:700;cursor:pointer}.pos.on{background:#fff;color:#0a0a0b;border-color:#fff}
.hd{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-bottom:6px}
.ovr{width:70px;border-radius:14px;text-align:center;padding:8px 0;font-family:'Archivo Black',sans-serif;color:#fff}.ovr small{display:block;font:700 12px 'Work Sans';opacity:.9}.ovr b{font-size:36px;line-height:1;font-weight:400}
.hc{background:var(--panel);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.pill{display:inline-block;background:#1b3a8a;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:6px}
.cn{font-family:'Archivo Black',sans-serif;font-size:20px;line-height:1.1;grid-column:1}
.rt{text-align:right;font-size:12px;color:var(--mute)}.rt b{font-size:22px;color:var(--chalk);font-family:'Archivo Black',sans-serif;font-weight:400}
.th,.tr{display:grid;grid-template-columns:46px 1fr 46px 36px 30px 30px;gap:4px;align-items:center}
.th{font-size:11px;color:var(--mute);padding:6px 4px;font-weight:700}
.tr{border-radius:12px;margin-bottom:5px;padding:4px;min-height:42px;font-weight:600}.tr.f{opacity:.28;background:var(--panel)}.tr.n{background:var(--p3);outline:2px solid var(--line)}
.ag{border-radius:9px;text-align:center;padding:8px 0;font-family:'Archivo Black',sans-serif;font-size:17px}
.ob{border-radius:8px;text-align:center;font-weight:700;padding:3px 0;font-size:15px}
.cb{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font:700 10px 'Work Sans';border:2px solid;vertical-align:middle;margin-right:6px}
.pn{background:var(--panel);border-radius:18px;padding:12px;margin-top:10px}.pn p{color:var(--mute);margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cards.two{grid-template-columns:1fr 1fr}
.cl{border:0;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:118px;justify-content:space-between}
.cl small{font-size:11px;opacity:.8}.cl .bg{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 18px 'Work Sans';border:3px solid}
.dc{border:0;border-radius:14px;padding:10px 8px;min-height:104px;text-align:center;cursor:pointer;background:var(--p3);display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-weight:700;font-size:15px}
.fx{background:var(--fx);border-radius:20px;padding:6px 9px;font-size:12px;font-weight:600;color:var(--fxt)}.fx.w{background:#4a1d28;color:#ffc4cc}
.tot{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;background:var(--p2);border-radius:12px;padding:10px 0;margin:10px 0}.tot b{display:block;font:400 20px 'Archivo Black'}.tot small{font-size:11px;color:var(--mute)}
.tro{font-size:36px;text-align:center;margin:8px 0;letter-spacing:6px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.sum{border:3px solid var(--y);border-radius:18px;padding:18px;background:var(--panel)}
@media (prefers-reduced-motion:no-preference){.pn,.sum{animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
.top{position:relative}.tg{position:absolute;right:0;top:0;background:var(--panel);border:2px solid var(--line);color:var(--chalk);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
.ob{color:#fff}.pill{color:#fff}
.md{display:grid;gap:12px}.mc{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--chalk);cursor:pointer;display:grid;gap:2px;font:inherit}.mc b{font:400 22px 'Archivo Black'}.mc span{color:var(--g);font-weight:700}.mc small{color:var(--mute);font-size:14px}.mc:focus-visible,.tg:focus-visible{outline:3px solid var(--y);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
.cl,.dc,.mc,.btn,.c{transition:transform .15s}
.cl:hover,.dc:hover,.mc:hover{transform:translateY(-3px)}
.cl:active,.dc:active,.mc:active,.c:active,.btn:active{transform:scale(.96)}
.tr.nw{animation:nw 1s ease}@keyframes nw{0%{transform:translateX(-16px);opacity:0}40%{box-shadow:0 0 0 2px var(--y)}100%{box-shadow:0 0 0 0 transparent}}
.cl,.dc,.mc{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}@keyframes pop{from{opacity:0;transform:scale(.8) translateY(14px)}}
.mc:nth-child(2){animation-delay:.08s}.mc:nth-child(3){animation-delay:.16s}
.ovr.up{animation:up .8s}@keyframes up{40%{transform:scale(1.12);box-shadow:0 0 24px #ffffff88}}
.ovr.dn{animation:dn .6s}@keyframes dn{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.tro{animation:tro 1s}@keyframes tro{from{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}}
.pos.on{animation:beat .4s}@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.2)}}
}
</style></head>

{t:'Entrevista picante',d:'Un periodista te provoca con una pregunta incómoda.',o:[['Responder sin filtro','-1 OVR · más ruido',{o:-1}],['Sonreír y callar','+1 OVR',{o:1}]]},
{t:'Hora de mentorear',d:'Un juvenil te pide consejos todos los días.',o:[['Ser su mentor','+2 OVR',{o:2}],['Enfocarte en ti','+1 OVR · más minutos',{o:1,m:.1}]]},
{t:'Dieta a medida',d:'El club te ofrece un nutricionista personal.',o:[['Aceptar el plan','+2 OVR',{o:2}],['Comer como siempre','Sin cambios',{o:0}]]},
{t:'Llamado de la selección',d:'Te convocan para los próximos partidos.',o:[['Ir con tu país','+1 OVR · cansancio',{o:1,m:.1,l:.15}],['Descansar','Menos riesgo de lesión',{o:0}]]},
{t:'La cinta de capitán',d:'El vestuario te propone como capitán.',o:[['Aceptar la cinta','+2 OVR · más presión',{o:2,l:.1}],['Dejársela a otro','Menos presión',{o:0,m:.05}]]}];
var $=function(s){return document.querySelector(s)},app=$('#app'),S,W;
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function C(v,a,b){return Math.max(a,Math.min(b,v))}
function E(x){return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function lum(h){var n=parseInt(h.slice(1),16);return ((n>>16)*.3+((n>>8)&255)*.59+(n&255)*.11)}
function ink(h){return lum(h)>140?'#0a120e':'#ffffff'}
function ini(n){return n.split(' ').map(function(w){return w[0]}).slice(0,2).join('').toUpperCase()}
function money(k){return k>=1000?'€'+(k/1000>=100?Math.round(k/1000):(Math.round(k/100)/10))+'M':'€'+Math.max(10,Math.round(k/10)*10)+'K'}
function hdr(p){return '<div class="top">Destino&nbsp;<span>FC</span><button class="tg" onclick="tg()" aria-label="Cambiar tema">◐</button></div><div class="pg"><b style="width:'+p+'%"></b></div>'}
function nav(back,next,label,dis){return '<div class="nav"><button class="btn" id="bk">Volver</button><button class="btn p" id="nx"'+(dis?' disabled':'')+'>'+label+'</button></div>'}
function shirt(){
 var p=W.nat,c1=p[2],c2=p[3],t=ink(c1),ap=(W.ape||'APELLIDO').toUpperCase();
 return '<svg viewBox="0 0 240 250" style="width:56%;max-width:230px;display:block;margin:6px auto"><path d="M72 14 L100 6 Q120 26 140 6 L168 14 L224 66 L198 98 L176 84 L176 236 Q120 246 64 236 L64 84 L42 98 L16 66 Z" fill="'+c1+'"/><path d="M100 6 Q120 26 140 6" stroke="'+c2+'" stroke-width="7" fill="none"/><path d="M16 66 L42 98" stroke="'+c2+'" stroke-width="9"/><path d="M224 66 L198 98" stroke="'+c2+'" stroke-width="9"/><text x="120" y="76" text-anchor="middle" font-family="Archivo Black,Impact" font-size="'+(ap.length>9?16:21)+'" fill="'+t+'">'+E(ap)+'</text><text x="120" y="156" text-anchor="middle" font-family="Archivo Black,Impact" font-size="76" fill="'+t+'">'+E(W.num||'10')+'</text></svg>';
}
function s1(q){
 q=(q||'').toLowerCase();
 var l=PA.filter(function(p){return p[0].toLowerCase().indexOf(q)>-1});
 $('#ls').innerHTML=l.map(function(p){return '<button class="c" data-n="'+p[0]+'"><span class="f">'+p[1]+'</span>'+p[0]+'</button>'}).join('');
 document.querySelectorAll('.c').forEach(function(b){b.onclick=function(){W.nat=PA.filter(function(p){return p[0]==b.dataset.n})[0];wiz(2)}});
}
function wiz(n){
 if(n==0){app.innerHTML=hdr(8)+'<h2>Elige tu ritmo</h2><div class="md">'+[[1,'Lento','Año por año','Cada temporada cuenta. Carrera larga y detallada.'],[2,'Normal','Cada 2 años','El ritmo equilibrado.'],[3,'Exprés','Cada 3 años','Carrera rápida, en pocos minutos.']].map(function(m){return '<button class="mc" data-s="'+m[0]+'"><b>'+m[1]+'</b><span>'+m[2]+'</span><small>'+m[3]+'</small></button>'}).join('')+'</div>';document.querySelectorAll('.mc').forEach(function(b){b.onclick=function(){W.step=+b.dataset.s;wiz(1)}})}
 if(n==1){app.innerHTML=hdr(33)+'<h2>Nacionalidad</h2><input class="in" id="sr" placeholder="Buscar país" style="text-transform:none;text-align:left"><div class="cs" id="ls"></div>';s1();$('#sr').oninput=function(){s1(this.value)}}

 }
 if(n==3){

function begin(){

function val(){var v=100*Math.exp((S.ovr-50)*.17);var a=S.age;if(a>30)v*=Math.max(.04,1-(a-30)*.16);return v}

function sim(){
 var a=S.age,g=0,pm=S.pm||{};S.po=S.ovr;for(var y=0;y<S.step;y++)g+=gr(a+y);

 var inj=Math.random()<(pm.l||0),sl=S.club[2],gap=S.ovr-(38+sl*9),mins=C(.5+gap/30+(pm.m||0)+R(-10,10)/100,.12,1);
 if(inj){mins*=.55;S.ovr-=1}
 var pj=Math.round(mins*35*S.step),P=PS[S.pos],f=.3+(S.ovr-50)/60,gl=Math.round(pj*P[2]*.4*f*(R(60,130)/100)),as=Math.round(pj*P[3]*.35*f*(R(60,130)/100)),t=0;

 S.ph=S.ph=='offer'?'dec':'offer';
 if(S.age>=38||(S.age>=30&&S.ovr<54))S.ph='end';

function ovc(o){return o>=80?'linear-gradient(#f5c542,#e08a0b)':o>=65?'linear-gradient(#7d8fa6,#4b5b70)':'linear-gradient(#e0861c,#a9540b)'}
function bd(c,s){return '<span class="bd" style="background:'+c[3]+';color:'+c[4]+';border-color:'+c[4]+'">'+ini(c[0])+'</span>'}
function board(){
